name: Deploy API

# The AWS stack has been torn down deliberately (see docs/aws-teardown.md).
# The automatic push trigger is disabled so that merging backend changes to
# main does not silently re-provision the whole stack — VPC, NAT gateway, ALB,
# RDS and two Fargate tasks, ~EUR 135/month — without anyone asking for it.
#
# Deploys are manual-only for now: run this workflow from the Actions tab
# ("Run workflow"). To restore continuous deployment, uncomment the push block
# below.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths:
  #     - 'api/**'
  #     - 'ai_engine/**'
  #     - 'chic_finder/**'
  #     - 'shared/**'
  #     - 'scripts/**'
  #     - 'requirements.txt'
  #     - 'requirements.lock'
  #     - 'infrastructure/docker/Dockerfile.api'
  #     - 'infrastructure/cdk/**'
  #     - '.github/workflows/deploy-api.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CDK app dependencies
        working-directory: infrastructure/cdk
        run: pip install -r requirements.txt

      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk

      - name: Deploy
        working-directory: infrastructure/cdk
        run: cdk deploy --require-approval never
